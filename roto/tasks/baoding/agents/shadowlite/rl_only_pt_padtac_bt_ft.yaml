# Shadow Baoding: fine-tune padtac_bt from a PadTac checkpoint.
# Logs go to rl_only_pt_padtac_bt_ft/ — NEVER under rl_only_pt_padtac/.

agent:
  rollouts: 32
  learning_epochs: 8
  mini_batches: 4
  discount_factor: 0.99
  lambda: 0.95
  # Slightly lower LR than scratch padtac (2.02e-4) for fine-tuning.
  learning_rate: 1.0e-04
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  value_loss_scale: 1.0
  entropy_loss_scale: 0.08
  kl_threshold: 0

experiment:
  experiment_name: rl_only_pt_padtac_bt_ft
  wandb: 0
  wandb_kwargs:
    group: rl_only_pt_padtac_bt_ft
    name: '1'
