# Shadow Baoding: rl_only_pt_padtac_bt + temporal hold filter on the taxels.
# The agent: block is copied verbatim from rl_only_pt_padtac_bt.yaml so the
# tactile filter is the only difference between the two runs.

# Only the smoothing sub-block is overridden; update_dict deep-merges, so
# binary_tactile/binary_threshold still come from default.yaml.
# k_on=3, k_off=1: a taxel must read ON for 3 consecutive control steps (50 ms
# at 60 Hz) before the policy sees a 1, and drops on the first OFF step. This
# rejects 1-2 frame contact blips at the cost of onset latency.
# NOTE: deploy_policy_new.py has K_ON/K_OFF constants that must match these.
observations:
  tactile_cfg:
    smoothing:
      k_on: 3
      k_off: 1

agent:
  rollouts: 32
  learning_epochs: 8
  mini_batches: 4
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 2.02e-04
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  value_loss_scale: 1.0
  entropy_loss_scale: 0.05
  kl_threshold: 0

experiment:
  experiment_name: rl_only_pt_padtac_bt_smooth
  wandb: 0
  wandb_kwargs:
    group: rl_only_pt_padtac_bt_smooth
    name: '1'
